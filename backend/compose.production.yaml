# docker compose -f compose.yaml -f compose.production.yaml up -d --build   (on the server: server deploy <this folder>)
# Uses the server's shared services (infra/server.sh): the Caddy proxy on the "edge" network serves the API with HTTPS
# (deploy/api.caddy is its entry), and the shared PostgreSQL on the private "data" network holds the "batra" database
# (created with: server add-db batra; its password is DB_PASSWORD). The local db container is not started.
# Adds a nightly database/media backup. Nothing here publishes a port.
services:
  api:
    ports: !reset []
    depends_on: !reset {}
    networks:
      default: {}
      data: {}
      edge:
        # Unique name on the shared network: every project's "api" service would otherwise answer to "api".
        aliases: [batra-api]
    environment:
      DATABASE_URL: postgres://batra:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/batra
      TRUST_PROXY_HOPS: 1
      # Email can be configured here or later in the web dashboard (Integrations); codes are not sent until one is set.
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CLOSED_REPORT_RETENTION_DAYS: ${CLOSED_REPORT_RETENTION_DAYS:-365}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      PGUSER: batra
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PGDATABASE: batra
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - media:/media:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh","-c","while true; do /bin/sh /backup.sh || echo 'backup failed' >&2; sleep 86400; done"]
    networks: [data]
    restart: unless-stopped
  db:
    profiles: [local-db]
networks:
  edge:
    external: true
  data:
    external: true
