# docker compose -f compose.yaml -f compose.production.yaml up -d --build
# Adds HTTPS termination with Caddy and a nightly database/media backup. Caddy is the only public port.
services:
  api:
    ports: !reset []
    environment:
      TRUST_PROXY_HOPS: 1
      # Email can be configured here or later in the web dashboard (Integrations); codes are not sent until one is set.
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
      SMS_PROVIDER: ${SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      CLOSED_REPORT_RETENTION_DAYS: ${CLOSED_REPORT_RETENTION_DAYS:-0}
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "10" }
  caddy:
    image: caddy:2.10-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN, e.g. api.batraconnect.com}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    restart: unless-stopped
  backup:
    image: postgres:17-alpine
    environment:
      PGHOST: db
      PGUSER: batra
      PGPASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      PGDATABASE: batra_connect
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      - media:/media:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ["/bin/sh","-c","while true; do /bin/sh /backup.sh || echo 'backup failed' >&2; sleep 86400; done"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
